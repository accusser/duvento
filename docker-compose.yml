# Опционально. Основной путь — README без Docker.
# Сначала на хосте: composer install && npm install && npm run build && cp .env.example .env
# В .env: DB_CONNECTION=mysql, DB_HOST=db, DB_PORT=3306, DB_DATABASE=duvento, DB_USERNAME=duvento, DB_PASSWORD=duvento

services:
  app:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8090:8090"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: duvento
      DB_USERNAME: duvento
      DB_PASSWORD: duvento
    depends_on:
      db:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8090

  scheduler:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: duvento
      DB_USERNAME: duvento
      DB_PASSWORD: duvento
    depends_on:
      db:
        condition: service_healthy
    command: php artisan schedule:work

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: duvento
      MARIADB_USER: duvento
      MARIADB_PASSWORD: duvento
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - duvento_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  duvento_db:
