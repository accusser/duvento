name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite, pdo_sqlite, openssl, tokenizer, xml, ctype, json, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test
